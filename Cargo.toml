[package]
name = "hyperbolic-tiling"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
bytemuck = { version = "=1.25.2", features = ["derive"] }
egui = { version = "=0.37.0", features = ["default_fonts"] }
egui-wgpu = { version = "=0.37.0", default-features = false }
egui-winit = { version = "=0.37.0", default-features = false, features = ["wayland", "x11"] }
glam = "=0.34.1"
web-time = "=1.1.0"
wgpu = "=30.0.1"
winit = "=0.30.13"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = "=1.0.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "=0.1.7"
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "=0.4.79"
# The #view= fragment, and the console for printing the view.
web-sys = { version = "=0.3.106", features = ["Window", "Location", "console"] }
# WebGL2 as a fallback where the browser lacks WebGPU.
wgpu = { version = "=30.0.1", features = ["webgl"] }

[dev-dependencies]
naga = { version = "=30.0.1", features = ["wgsl-in"] }
