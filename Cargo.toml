[package]
name = "hyperbolic-tiling"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
bytemuck = { version = "=1.25.2", features = ["derive"] }
egui = { version = "=0.37.0", features = ["default_fonts"] }
egui-wgpu = { version = "=0.37.0", default-features = false }
egui-winit = { version = "=0.37.0", default-features = false, features = ["wayland", "x11"] }
glam = "=0.34.1"
pollster = "=1.0.1"
wgpu = "=30.0.1"
winit = "=0.30.13"

[dev-dependencies]
naga = { version = "=30.0.1", features = ["wgsl-in"] }
